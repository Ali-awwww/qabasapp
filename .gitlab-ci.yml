# GitLab CI — بناء APK لتطبيق "استوديو قبس"
# يعكس خطوة البناء في GitHub Actions (android-ci.yml) باستخدام JDK 17 + Android SDK.
# ملاحظة: على GitLab.com تتطلب الوظائف حساباً موثّق الهوية (identity verification)،
# وإلا يفشل البايبلاين خلال 0 ثانية بدون أي job.

image: eclipse-temurin:17-jdk-jammy

stages:
  - build

variables:
  # نجعل كل الأدوات داخل مجلد المشروع لتسهيل الترصيد (caching).
  ANDROID_SDK_ROOT: "$CI_PROJECT_DIR/.android-sdk"
  ANDROID_HOME: "$CI_PROJECT_DIR/.android-sdk"
  GRADLE_USER_HOME: "$CI_PROJECT_DIR/.gradle-home"
  DEBIAN_FRONTEND: noninteractive
  GRADLE_OPTS: "-Dorg.gradle.jvmargs=-Xmx2560m -Dkotlin.daemon.jvmargs=-Xmx3072m -XX:+UseG1GC -Dfile.encoding=UTF-8"
  # إصدار أدوات سطر الأوامر من Google.
  CMDLINE_TOOLS_VERSION: "13114758"
  ANDROID_PLATFORM: "android-36"
  ANDROID_BUILD_TOOLS: "36.0.0"

workflow:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS'
      when: never
    - if: '$CI_COMMIT_BRANCH'
    - if: '$CI_PIPELINE_SOURCE == "web"'

cache:
  key: "$CI_COMMIT_REF_SLUG"
  paths:
    - .gradle-home/caches
    - .gradle-home/wrapper
    - .android-sdk

build-debug-apk:
  stage: build
  timeout: 1h
  interruptible: true
  script:
    - apt-get update -qq
    - apt-get install -y -qq --no-install-recommends curl unzip ca-certificates > /dev/null

    # 1) تنصيب أدوات Android SDK إن لم تكن في الذاكرة المؤقتة.
    - |
      if [ ! -x "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" ]; then
        echo "Installing Android command-line tools..."
        mkdir -p "$ANDROID_SDK_ROOT/cmdline-tools"
        curl -sSL -o /tmp/cmdline-tools.zip \
          "https://dl.google.com/android/repository/commandlinetools-linux-${CMDLINE_TOOLS_VERSION}_latest.zip"
        unzip -q /tmp/cmdline-tools.zip -d /tmp/cmdline-tools
        rm -f /tmp/cmdline-tools.zip
        mv /tmp/cmdline-tools/cmdline-tools "$ANDROID_SDK_ROOT/cmdline-tools/latest"
      fi

    - export PATH="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin:$ANDROID_SDK_ROOT/platform-tools:$PATH"

    # 2) قبول الرخص وتنصيب الحِزم. NDK + CMake يُنزّلهما AGP تلقائياً أثناء البناء.
    - yes | sdkmanager --licenses > /dev/null 2>&1 || true
    - sdkmanager "platform-tools" "platforms;${ANDROID_PLATFORM}" "build-tools;${ANDROID_BUILD_TOOLS}"

    # 3) مفتاح توقيع ثابت (debug) لأن debug.keystore مستبعَد من git.
    - chmod +x gradlew
    - |
      if [ ! -f debug.keystore ]; then
        keytool -genkeypair -v \
          -keystore debug.keystore \
          -storepass android -keypass android \
          -alias androiddebugkey \
          -keyalg RSA -keysize 2048 -validity 10000 \
          -dname "CN=Android Debug,O=Android,C=US"
      fi

    # 4) البناء. نرقّي versionCode تصاعدياً اعتماداً على رقم البايبلاين.
    - |
      VERSION_CODE=$((102 + CI_PIPELINE_IID))
      ./gradlew --no-daemon --max-workers=2 \
        -PappVersionCode="$VERSION_CODE" \
        assembleDebug

  after_script:
    - echo "APK output:"
    - ls -lh app/build/outputs/apk/debug/ || true

  artifacts:
    name: "qabas-debug-$CI_COMMIT_SHORT_SHA"
    paths:
      - app/build/outputs/apk/debug/*.apk
    expire_in: 30 days
    when: on_success
