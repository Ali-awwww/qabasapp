name: Build & Sign APK

on:
  push:
    branches: [main, master]
    paths:
      - 'app/src/**'
      - 'app/build.gradle.kts'
      - 'build.gradle.kts'
      - 'settings.gradle.kts'
      - 'gradle/**'
      - 'gradlew'
      - 'gradlew.bat'
      - '.github/workflows/android-ci.yml'
  pull_request:
    branches: [main, master]
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Setup Android SDK
        run: |
          export ANDROID_HOME="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "platform-tools" "build-tools;36.0.0" "platforms;android-36"

      - name: Fix gradle-wrapper.jar
        run: |
          mkdir -p gradle/wrapper
          if ! python3 -c "import zipfile,sys; sys.exit(0 if zipfile.is_zipfile('gradle/wrapper/gradle-wrapper.jar') else 1)"; then
            curl -sL -o gradle/wrapper/gradle-wrapper.jar \
              "https://raw.githubusercontent.com/gradle/gradle/v9.3.1/gradle/wrapper/gradle-wrapper.jar"
          fi
          python3 -c "import zipfile; zipfile.ZipFile('gradle/wrapper/gradle-wrapper.jar').namelist(); print('wrapper jar OK')"
          chmod +x gradlew

      - name: Restore Stable Signing Keystore
        run: |
          echo "Restoring permanent, consistent signing keystore to preserve app update compatibility..."
          
          # Priority 1: Decode from repository file debug.keystore.base64 if present
          if [ -f "debug.keystore.base64" ]; then
            echo "Found debug.keystore.base64 in repository, decoding..."
            base64 -d debug.keystore.base64 > debug.keystore
          elif [ -n "${{ secrets.RELEASE_KEYSTORE_BASE64 }}" ]; then
            echo "Decoding from GitHub Secret RELEASE_KEYSTORE_BASE64..."
            echo "${{ secrets.RELEASE_KEYSTORE_BASE64 }}" | base64 -d > debug.keystore
          else
            echo "Restoring embedded permanent release/debug keystore..."
            cat << 'EOF' | base64 -d > debug.keystore
          
          EOF
          fi

          if [ -f debug.keystore ]; then
            echo "✅ Stable Keystore restored successfully"
            ls -lh debug.keystore
          else
            echo "❌ Keystore restoration failed"
            exit 1
          fi

      - name: Extract & Display Signing Key Fingerprint
        run: |
          if [ -f debug.keystore ]; then
            echo "🔑 ========== SIGNING KEY INFORMATION =========="
            echo ""
            echo "📋 Key Alias: androiddebugkey"
            echo "🏪 Keystore File: debug.keystore"
            echo "🔐 Store Password: android"
            echo "🔐 Key Password: android"
            echo ""
            echo "📊 Fingerprints:"
            echo "─────────────────────────────────────────────"
            
            # Extract SHA1 Fingerprint
            SHA1=$(keytool -list -v -keystore debug.keystore -storepass android -keypass android -alias androiddebugkey 2>/dev/null | grep "SHA1:" | head -1 | awk '{print $NF}')
            echo "SHA1: $SHA1"
            
            # Extract SHA256 Fingerprint
            SHA256=$(keytool -list -v -keystore debug.keystore -storepass android -keypass android -alias androiddebugkey 2>/dev/null | grep "SHA256:" | head -1 | awk '{print $NF}')
            echo "SHA256: $SHA256"
            
            echo "─────────────────────────────────────────────"
            echo ""
            
            # Save fingerprints to file
            {
              echo "SIGNING_KEY_ALIAS=androiddebugkey"
              echo "KEYSTORE_FILE=debug.keystore"
              echo "STORE_PASSWORD=android"
              echo "KEY_PASSWORD=android"
              echo "SHA1_FINGERPRINT=$SHA1"
              echo "SHA256_FINGERPRINT=$SHA256"
              echo "VALID_UNTIL=10000 days"
              echo "KEY_ALGORITHM=RSA"
              echo "KEY_SIZE=2048"
            } > signing_key_info.txt
            
            echo "✅ Signing key information saved to: signing_key_info.txt"
          fi

      - name: Inject secrets (optional)
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          QF_CLIENT_ID: ${{ secrets.QF_CLIENT_ID }}
          QF_CLIENT_SECRET: ${{ secrets.QF_CLIENT_SECRET }}
        run: |
          if [ -n "$GOOGLE_SERVICES_JSON" ]; then
            mkdir -p app
            echo "$GOOGLE_SERVICES_JSON" > app/google-services.json
          fi
          {
            echo "SUPABASE_URL=\"${SUPABASE_URL:-https://YOUR_PROJECT_REF.supabase.co}\""
            echo "SUPABASE_ANON_KEY=\"${SUPABASE_ANON_KEY:-your_publishable_or_anon_key}\""
            echo "GEMINI_API_KEY=\"${GEMINI_API_KEY:-your_key}\""
            echo "AZURE_SPEECH_KEY=\"your_key\""
            echo "AZURE_SPEECH_REGION=\"your_region\""
            echo "COVERR_API_KEY=\"your_key\""
            echo "ELEVENLABS_API_KEY=\"your_key\""
            echo "GOOGLE_WEB_CLIENT_ID=\"your_key\""
            echo "GROQ_API_KEY=\"your_key\""
            echo "HUGGINGFACE_API_KEY=\"your_key\""
            echo "OPENAI_API_KEY=\"your_key\""
            echo "OPENROUTER_API_KEY=\"your_key\""
            echo "PEXELS_API_KEY=\"your_key\""
            echo "PIXABAY_API_KEY=\"your_key\""
            echo "QF_CLIENT_ID=\"${QF_CLIENT_ID:-your_key}\""
            echo "QF_CLIENT_SECRET=\"${QF_CLIENT_SECRET:-your_key}\""
          } > .env

      - name: Assemble Debug APK
        env:
          BUILD_NUMBER: ${{ github.run_number }}
        run: |
          ./gradlew assembleDebug \
            --stacktrace \
            --no-daemon \
            --max-workers=2 \
            --build-cache

      - name: Verify APK Signature
        run: |
          APK_FILE=$(find app/build/outputs/apk -name "*.apk" | head -1)
          if [ -n "$APK_FILE" ]; then
            echo "🔍 Verifying APK Signature..."
            echo "APK: $APK_FILE"
            echo "─────────────────────────────────────────────"
            jarsigner -verify -verbose -certs "$APK_FILE" 2>&1 | grep -E "(jar verified|CN=)" || true
            echo "✅ APK Signature Verification Complete"
          fi

      - name: Upload APK artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: qabas-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: warn
          retention-days: 7

      - name: Upload Signing Key Information
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: signing-key-info
          path: signing_key_info.txt
          if-no-files-found: ignore
          retention-days: 7

      - name: On failure — print Kotlin errors hint
        if: failure()
        run: |
          echo "ابحث في اللوج عن: e: file://  أو Unresolved reference"
