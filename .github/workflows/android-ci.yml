name: Build & Sign APK

on:
  push:
    branches: [main, master]
    paths:
      - 'app/src/**'
      - 'app/build.gradle.kts'
      - 'build.gradle.kts'
      - 'settings.gradle.kts'
      - 'gradle/**'
      - 'gradle.properties'
      - 'gradlew'
      - 'gradlew.bat'
      - '.github/workflows/android-ci.yml'
  pull_request:
    branches: [main, master]
  workflow_dispatch:

concurrency:
  # Use a fresh group namespace to release runs queued under the previous key.
  # Newer pushes on the same branch cancel the older in-progress build.
  group: android-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write
      actions: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          # Gradle executes code from pull requests; do not persist a repository token in the checkout.
          persist-credentials: false

      - name: Set up JDK 17
        uses: actions/setup-java@v6.2.0
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Gradle (Cache & Build Setup)
        uses: gradle/actions/setup-gradle@v4
        with:
          # Untrusted pull-request builds must not be able to poison caches used by trusted builds.
          cache-read-only: ${{ github.ref != 'refs/heads/main' && github.ref != 'refs/heads/master' }}
          gradle-home-cache-cleanup: true

      - name: Setup Android SDK
        run: |
          export ANDROID_HOME="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses || true
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install \
            "platform-tools" \
            "build-tools;36.0.0" \
            "platforms;android-36" \
            "cmake;3.22.1" \
            "ndk;28.2.13676358"
          test -d "$ANDROID_HOME/cmake/3.22.1"
          test -d "$ANDROID_HOME/ndk/28.2.13676358"
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --list_installed | grep -E "platforms;android-36|cmake;3.22.1|ndk;28.2.13676358"

      - name: Fix gradle-wrapper.jar
        run: |
          mkdir -p gradle/wrapper
          if ! python3 -c "import zipfile,sys; sys.exit(0 if zipfile.is_zipfile('gradle/wrapper/gradle-wrapper.jar') else 1)"; then
            curl -sL -o gradle/wrapper/gradle-wrapper.jar \
              "https://raw.githubusercontent.com/gradle/gradle/v9.3.1/gradle/wrapper/gradle-wrapper.jar"
          fi
          python3 -c "import zipfile; zipfile.ZipFile('gradle/wrapper/gradle-wrapper.jar').namelist(); print('wrapper jar OK')"
          chmod +x gradlew

      # Pull-request source is untrusted: never materialize a repository signing secret before Gradle runs.
      - name: Restore Stable Signing Keystore
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        shell: bash
        run: |
          echo "Restoring permanent, consistent signing keystore to preserve app update compatibility..."

          SUCCESS=0
          if [ -n "${{ secrets.RELEASE_KEYSTORE_BASE64 }}" ]; then
            echo "🔑 Decoding from GitHub Secret RELEASE_KEYSTORE_BASE64..."
            printf '%s' "${{ secrets.RELEASE_KEYSTORE_BASE64 }}" | tr -d ' \t\r\n' | base64 -d > debug.keystore 2>/dev/null || true
            if [ -s debug.keystore ]; then
              SUCCESS=1
            else
              echo "⚠️ GitHub Secret RELEASE_KEYSTORE_BASE64 contained invalid base64 data. Falling back to repo file."
              rm -f debug.keystore
            fi
          fi

          if [ $SUCCESS -eq 0 ] && [ -f "debug.keystore.base64" ]; then
            echo "📦 Found debug.keystore.base64 in repository, decoding fallback..."
            base64 -d debug.keystore.base64 > debug.keystore 2>/dev/null || true
            if [ -s debug.keystore ]; then
              SUCCESS=1
            fi
          fi
          # Ensure debug.keystore exists with proper Android debug key
          if [ ! -f debug.keystore ]; then
            keytool -genkeypair -v -keystore debug.keystore -storepass android -keypass android -alias androiddebugkey -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US" 2>/dev/null || true
          fi

          if [ -f debug.keystore ] && [ -s debug.keystore ]; then
            echo "✅ Stable Keystore restored successfully"
            ls -lh debug.keystore
          else
            echo "❌ Keystore restoration failed"
            exit 1
          fi

      - name: Create ephemeral debug keystore for pull request builds
        if: github.ref != 'refs/heads/main' && github.ref != 'refs/heads/master'
        run: |
          keytool -genkeypair -v -keystore debug.keystore -storepass android -keypass android -alias androiddebugkey -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"

      - name: Extract & Display Signing Key Fingerprint
        run: |
          if [ -f debug.keystore ]; then
            echo "🔑 ========== SIGNING KEY INFORMATION =========="
            echo ""
            echo "📋 Key Alias: androiddebugkey"
            echo "🏪 Keystore File: debug.keystore"
            echo "🔐 Store Password: android"
            echo "🔐 Key Password: android"
            echo ""
            echo "📊 Fingerprints:"
            echo "─────────────────────────────────────────────"

            SHA1=$(keytool -list -v -keystore debug.keystore -storepass android -keypass android -alias androiddebugkey 2>/dev/null | grep "SHA1:" | head -1 | awk '{print $NF}')
            echo "SHA1: $SHA1"

            SHA256=$(keytool -list -v -keystore debug.keystore -storepass android -keypass android -alias androiddebugkey 2>/dev/null | grep "SHA256:" | head -1 | awk '{print $NF}')
            echo "SHA256: $SHA256"

            echo "─────────────────────────────────────────────"
            echo ""

            {
              echo "SIGNING_KEY_ALIAS=androiddebugkey"
              echo "KEYSTORE_FILE=debug.keystore"
              echo "STORE_PASSWORD=android"
              echo "KEY_PASSWORD=android"
              echo "SHA1_FINGERPRINT=$SHA1"
              echo "SHA256_FINGERPRINT=$SHA256"
              echo "VALID_UNTIL=10000 days"
              echo "KEY_ALGORITHM=RSA"
              echo "KEY_SIZE=2048"
            } > signing_key_info.txt

            echo "✅ Signing key information saved to: signing_key_info.txt"
          fi

      # Keep BuildConfig generation valid without exposing repository secrets to PR-controlled code.
      - name: Create non-secret environment for pull request builds
        if: github.ref != 'refs/heads/main' && github.ref != 'refs/heads/master'
        shell: bash
        run: |
          cat > .env <<'EOF'
          AW_CLIENT_ID="ci-placeholder"
          AW_CLIENT_SECRET="ci-placeholder"
          AZURE_SPEECH_KEY="ci-placeholder"
          AZURE_SPEECH_REGION="ci-placeholder"
          COVERR_API_KEY="ci-placeholder"
          ELEVENLABS_API_KEY="ci-placeholder"
          GOOGLE_WEB_CLIENT_ID="ci-placeholder"
          GROQ_API_KEY="ci-placeholder"
          HUGGINGFACE_API_KEY="ci-placeholder"
          OPENAI_API_KEY="ci-placeholder"
          OPENROUTER_API_KEY="ci-placeholder"
          PEXELS_API_KEY="ci-placeholder"
          PIXABAY_API_KEY="ci-placeholder"
          QF_CLIENT_ID="ci-placeholder"
          QF_CLIENT_SECRET="ci-placeholder"
          SUPABASE_ANON_KEY="ci-placeholder"
          SUPABASE_URL="https://example.supabase.co"
          EOF

      - name: Inject secrets (optional)
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          QF_CLIENT_ID: ${{ secrets.QF_CLIENT_ID }}
          QF_CLIENT_SECRET: ${{ secrets.QF_CLIENT_SECRET }}
        run: |
          mkdir -p app
          if [ -n "$GOOGLE_SERVICES_JSON" ]; then
            echo "$GOOGLE_SERVICES_JSON" > app/google-services.json
          elif [ ! -f "app/google-services.json" ]; then
            echo "Generating fallback google-services.json for CI build..."
            echo "" | base64 -d > app/google-services.json
          fi
          {
            echo "SUPABASE_URL=\"${SUPABASE_URL:-https://YOUR_PROJECT_REF.supabase.co}\""
            echo "SUPABASE_ANON_KEY=\"${SUPABASE_ANON_KEY:-your_publishable_or_anon_key}\""
            echo "GEMINI_API_KEY=\"${GEMINI_API_KEY:-your_key}\""
            echo "AZURE_SPEECH_KEY=\"your_key\""
            echo "AZURE_SPEECH_REGION=\"your_region\""
            echo "COVERR_API_KEY=\"your_key\""
            echo "ELEVENLABS_API_KEY=\"your_key\""
            echo "GOOGLE_WEB_CLIENT_ID=\"your_key\""
            echo "GROQ_API_KEY=\"your_key\""
            echo "HUGGINGFACE_API_KEY=\"your_key\""
            echo "OPENAI_API_KEY=\"your_key\""
            echo "OPENROUTER_API_KEY=\"your_key\""
            echo "PEXELS_API_KEY=\"your_key\""
            echo "PIXABAY_API_KEY=\"your_key\""
            echo "QF_CLIENT_ID=\"${QF_CLIENT_ID:-your_key}\""
            echo "QF_CLIENT_SECRET=\"${QF_CLIENT_SECRET:-your_key}\""
          } > .env

      - name: Compute Unique Release Version (xdelta base = last successful build)
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        id: release-version
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          VERSION_NAME=$(grep -oP '\?: "\K[^"]+' app/build.gradle.kts | head -1 || true)
          BASE_CODE=$(grep -oP '\?: \K[0-9]+' app/build.gradle.kts | head -1 || true)
          VERSION_NAME=${VERSION_NAME:-1.3.3}
          BASE_CODE=${BASE_CODE:-102}

          PREV_CODE=$(gh release list --limit 50 --json tagName --jq '.[].tagName' 2>/dev/null | grep -oP '\+\K[0-9]+' | sort -n | tail -1 || true)

          if [ -n "$PREV_CODE" ]; then
            NEW_CODE=$((PREV_CODE + 1))
          else
            NEW_CODE=$((BASE_CODE + 1))
          fi
          if [ "$NEW_CODE" -le "$BASE_CODE" ]; then
            NEW_CODE=$((BASE_CODE + 1))
          fi

          RELEASE_TAG="v${VERSION_NAME}+${NEW_CODE}"
          echo "VERSION_NAME=$VERSION_NAME" >> "$GITHUB_ENV"
          echo "VERSION_CODE=$NEW_CODE" >> "$GITHUB_ENV"
          echo "RELEASE_TAG=$RELEASE_TAG" >> "$GITHUB_ENV"
          echo "✅ Release tag: $RELEASE_TAG (versionName=$VERSION_NAME, versionCode=$NEW_CODE)"

      - name: Run Debug Unit Tests
        env:
          BUILD_NUMBER: ${{ github.run_number }}
          VERSION_NAME: ${{ env.VERSION_NAME }}
          VERSION_CODE: ${{ env.VERSION_CODE }}
          GRADLE_OPTS: "-Dorg.gradle.jvmargs=-Xmx2048m -Dkotlin.daemon.jvmargs=\"-Xmx1536m -XX:+UseG1GC\" -XX:+UseG1GC -Dfile.encoding=UTF-8"
        run: |
          ./gradlew testDebugUnitTest \
            --stacktrace \
            --no-daemon \
            --max-workers=2 \
            -PappVersionName="$VERSION_NAME" \
            -PappVersionCode="$VERSION_CODE" \
            -Dkotlin.daemon.jvmargs="-Xmx1536m -XX:+UseG1GC"

      - name: Assemble Debug APK
        env:
          BUILD_NUMBER: ${{ github.run_number }}
          VERSION_NAME: ${{ env.VERSION_NAME }}
          VERSION_CODE: ${{ env.VERSION_CODE }}
          GRADLE_OPTS: "-Dorg.gradle.jvmargs=-Xmx2048m -Dkotlin.daemon.jvmargs=\"-Xmx1536m -XX:+UseG1GC\" -XX:+UseG1GC -Dfile.encoding=UTF-8"
        run: |
          ./gradlew assembleDebug \
            --stacktrace \
            --no-daemon \
            --max-workers=2 \
            --no-build-cache \
            -PappVersionName="$VERSION_NAME" \
            -PappVersionCode="$VERSION_CODE" \
            -Dkotlin.daemon.jvmargs="-Xmx1536m -XX:+UseG1GC"

      - name: Verify xdelta JNI is packaged
        shell: bash
        run: |
          set -euo pipefail
          APK_FILE=$(find app/build/outputs/apk/debug -maxdepth 1 -name "*.apk" -print -quit)
          test -n "$APK_FILE"
          python3 - "$APK_FILE" <<'PY'
          import sys
          import zipfile

          apk = sys.argv[1]
          expected_abis = {"arm64-v8a", "armeabi-v7a", "x86_64"}
          with zipfile.ZipFile(apk) as archive:
              entries = set(archive.namelist())
          packaged = {
              abi for abi in expected_abis
              if f"lib/{abi}/libqabas_xdelta.so" in entries
          }
          missing = expected_abis - packaged
          if missing:
              raise SystemExit(
                  "Missing xdelta JNI library for ABI(s): " + ", ".join(sorted(missing))
              )
          print("Verified libqabas_xdelta.so in APK for: " + ", ".join(sorted(packaged)))
          PY

      - name: Verify APK Signature
        run: |
          APK_FILE=$(find app/build/outputs/apk -name "*.apk" | head -1)
          if [ -n "$APK_FILE" ]; then
            echo "🔍 Verifying APK Signature..."
            echo "APK: $APK_FILE"
            echo "─────────────────────────────────────────────"
            jarsigner -verify -verbose -certs "$APK_FILE" 2>&1 | grep -E "(jar verified|CN=)" || true
            echo "✅ APK Signature Verification Complete"
          fi

      - name: Upload APK artifact
        if: success()
        uses: actions/upload-artifact@v7
        with:
          name: qabas-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: warn
          retention-days: 30

      - name: Upload Signing Key Information
        if: success()
        uses: actions/upload-artifact@v7
        with:
          name: signing-key-info
          path: signing_key_info.txt
          if-no-files-found: ignore
          retention-days: 7

      - name: Distribute APK to Firebase App Distribution
        if: success() && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
        env:
          FIREBASE_APP_ID: ${{ secrets.FIREBASE_APP_ID }}
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
          FIREBASE_TESTER_GROUPS: ${{ secrets.FIREBASE_TESTER_GROUPS }}
        run: |
          set -euo pipefail
          if [[ -z "$FIREBASE_APP_ID" || -z "$FIREBASE_SERVICE_ACCOUNT_JSON" || -z "$FIREBASE_TESTER_GROUPS" ]]; then
            echo "Firebase App Distribution skipped: required Actions secrets are not configured."
            exit 0
          fi
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT_JSON" > "$RUNNER_TEMP/firebase-service-account.json"
          chmod 600 "$RUNNER_TEMP/firebase-service-account.json"
          export GOOGLE_APPLICATION_CREDENTIALS="$RUNNER_TEMP/firebase-service-account.json"
          npm install --global firebase-tools
          APK_FILE=$(find app/build/outputs/apk/debug -maxdepth 1 -name "*.apk" -print -quit)
          test -n "$APK_FILE"
          firebase appdistribution:distribute "$APK_FILE" \
            --app "$FIREBASE_APP_ID" \
            --groups "$FIREBASE_TESTER_GROUPS" \
            --release-notes "Qabas Studio CI build ${{ github.run_number }} from ${{ github.sha }}"

      - name: Create or Update GitHub Release
        if: success() && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ env.RELEASE_TAG }}
        run: |
          VERSION="${RELEASE_TAG}"
          APK_FILE=$(find app/build/outputs/apk -name "*.apk" | head -1)

          if [ -z "$APK_FILE" ]; then
            echo "❌ APK not found!"
            exit 1
          fi

          COMMIT_MESSAGE="$(git show -s --format=%B "$GITHUB_SHA")"
          if [ -z "$COMMIT_MESSAGE" ]; then
            COMMIT_MESSAGE="تعذر جلب رسالة commit لهذا البناء."
          fi

          {
            echo "📝 رسالة commit التي بُني منها هذا التحديث:"
            printf '%s\n' "$COMMIT_MESSAGE"
            echo ""
            echo "🚀 Automated build from commit $GITHUB_SHA"
            echo ""
            echo "📦 APK Details:"
            echo "- Build Number: ${{ github.run_number }}"
            echo "- Built at: $(date -u +'%Y-%m-%d %H:%M:%S UTC')"
            echo "- Branch: ${{ github.ref }}"
            echo "- Workflow Run: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
            echo ""
            echo "👇 xdelta updates are generated from this release."
          } > release_notes.md

          if gh release view "$VERSION" > /dev/null 2>&1; then
            echo "📝 Release $VERSION exists, updating APK asset..."
            gh release upload "$VERSION" "$APK_FILE" --clobber
          else
            echo "🆕 Creating release $VERSION..."
            gh release create "$VERSION" "$APK_FILE" \
              --title "Qabas Studio v${VERSION_NAME} - Build #${{ github.run_number }}" \
              --notes-file release_notes.md \
              --draft=false
          fi

          echo "✅ APK successfully attached to release $VERSION"

      - name: Publish release metadata to Supabase
        if: success() && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_PUBLISH_JWT: ${{ secrets.SUPABASE_PUBLISH_JWT }}
          RELEASE_TAG: ${{ env.RELEASE_TAG }}
          VERSION_NAME: ${{ env.VERSION_NAME }}
          VERSION_CODE: ${{ env.VERSION_CODE }}
        run: |
          set -euo pipefail
          test -n "$SUPABASE_URL" || { echo "❌ SUPABASE_URL is not configured"; exit 1; }
          test -n "$SUPABASE_PUBLISH_JWT" || {
            echo "❌ SUPABASE_PUBLISH_JWT is not configured; release metadata was not published."
            exit 1
          }
          APK_FILE=$(find app/build/outputs/apk -name "*.apk" | head -1)
          ASSET_NAME=$(basename "$APK_FILE")
          FILE_SIZE=$(stat -c '%s' "$APK_FILE")
          SHA256=$(sha256sum "$APK_FILE" | awk '{print $1}')
          DOWNLOAD_URL="https://github.com/${{ github.repository }}/releases/download/${RELEASE_TAG}/${ASSET_NAME}"
          RELEASE_URL="https://github.com/${{ github.repository }}/releases/tag/${RELEASE_TAG}"
          RELEASE_NOTES=$(gh release view "$RELEASE_TAG" --json body --jq '.body')
          jq -n \
            --arg version_name "$VERSION_NAME" \
            --argjson version_code "$VERSION_CODE" \
            --arg download_url "$DOWNLOAD_URL" \
            --arg release_notes "$RELEASE_NOTES" \
            --argjson file_size_bytes "$FILE_SIZE" \
            --arg sha256_hash "$SHA256" \
            --arg github_release_url "$RELEASE_URL" \
            --arg release_tag "$RELEASE_TAG" \
            --arg asset_name "$ASSET_NAME" \
            '{p_version_name:$version_name,p_version_code:$version_code,p_download_url:$download_url,p_release_notes:$release_notes,p_file_size_bytes:$file_size_bytes,p_sha256_hash:$sha256_hash,p_is_mandatory:false,p_github_release_url:$github_release_url,p_release_tag:$release_tag,p_asset_name:$asset_name,p_delta_url:null,p_delta_size_bytes:0,p_delta_sha256_hash:null,p_base_version_code:null,p_base_sha256_hash:null}' \
            > "$RUNNER_TEMP/publish-update.json"
          curl --fail-with-body --silent --show-error \
            -X POST "$SUPABASE_URL/rest/v1/rpc/publish_qabas_app_update" \
            -H "apikey: $SUPABASE_PUBLISH_JWT" \
            -H "Authorization: Bearer $SUPABASE_PUBLISH_JWT" \
            -H "Content-Type: application/json" \
            --data-binary @"$RUNNER_TEMP/publish-update.json" \
            > "$RUNNER_TEMP/publish-update-response.json"
          jq -e --arg code "$VERSION_CODE" '.version_code == ($code|tonumber)' "$RUNNER_TEMP/publish-update-response.json" >/dev/null
          echo "✅ Release metadata registered in Supabase: $RELEASE_TAG"

      - name: Trigger xdelta delta generation
        if: success() && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ env.RELEASE_TAG }}
        run: |
          # ملاحظة مهمة: الأحداث التي يولّدها GITHUB_TOKEN لا تشغّل وركفلوات أخرى
          # (الاستثناء الوحيد: workflow_dispatch) — لذلك إطلاق مولّد الديلتا بـ
          # "release: published" كان لا يعمل مع الإصدارات الآلية، ولا بدّ من التشريح الصريح هنا.
          if gh workflow run "xdelta--updates.yml" -f target_tag="$RELEASE_TAG"; then
            echo "✅ Dispatched xdelta generation for $RELEASE_TAG"
          else
            echo "⚠️ Failed to dispatch xdelta workflow — run it manually (non-fatal)"
          fi

      - name: On failure — print Kotlin errors hint
        if: failure()
        run: |
          echo "ابحث في اللوج عن: e: file://  أو Unresolved reference"
